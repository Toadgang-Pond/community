name: Foundation documentation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check community documentation
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s CONTRIBUTING.md
          test -s CODE_OF_CONDUCT.md
          test -s SECURITY.md
          test -s .github/ISSUE_TEMPLATE/bug_report.yml
          test -s .github/ISSUE_TEMPLATE/feature_request.yml
          test -s .github/ISSUE_TEMPLATE/config.yml
