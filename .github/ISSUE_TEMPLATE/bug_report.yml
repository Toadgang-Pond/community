name: Non-sensitive bug report
description: Report a reproducible issue that contains no private data
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not post credentials, seed phrases, personal data, exploit steps, or security vulnerabilities. Read SECURITY.md for private reporting guidance."
  - type: input
    id: project
    attributes:
      label: Project and version
      placeholder: "Project / version / platform"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and safe reproduction steps
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional non-sensitive context
